# This is BattleTowers Loot configuration.
# This is seperate from the config file and only affects the loot withhin the tower.

# Comment are denoted by #
# Syntax can be looked up at
#     https://learnxinyminutes.com/hocon/
#     https://docs.spongepowered.org/stable/en/server/getting-started/configuration/hocon.html

# This file will be regenerated if its deleted.
# The folowin comments explain the structure of loot tables.

# Each file has to start with "loot_tables"
"loot_tables"=[
    # The structure using the first table.
    {
        # Each table has an floor and table.
        # The floor indicates the level at which this loot can appear.
        # If an floor is missing than the loot from previous floor is used.
        # Each floor can only have one definition of table.
        floor=0
        # Table consists of a list of loot entries.
        table=[
            # Each entry consist of list of entries.
            {
                loot {
                    # If a given item roll a random amount to be added to the chest or not.
                    random=true
                    # Defines the item that is used to put into the chest.
                    stack {
                        # Id is the namespace id of a given item.
                        id="minecraft:item/stick"
                        # Metadata only need to be present if the value is not zero.
                        # Amount is only required when the default stack size is not 1
                    }
                    # Defines the min and max amount of a given item that can be added to the chest per roll.
                    # If the amount is fixed, the yield contains one field
                    #   fixed = $fixedAmount
                    # with $fixedAmount indicating how many items are generated per roll.
                    # An example can be found further down the file.
                    yield {
                        max=5
                        min=3
                    }
                }
                # The weight determins how common the item is.
                # To get an accurate idea of the chance use devide the weight by the total weight.
                # The total weight is the sum of all weights of a given table.
                weight=1
            },
            # Commas are only needed between two loot entries
            {
                loot {
                    random=true
                    stack {
                        id="minecraft:item/seeds_wheat"
                    }
                    yield {
                        max=5
                        min=3
                    }
                }
